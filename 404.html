<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Plata Pay</title>
<style>html,body{margin:0;background:#0b0e0b}    .notfound-screen {
      position: fixed;
      inset: 0;
      z-index: 9998;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 24px;
      background: radial-gradient(ellipse 65% 48% at 50% 52%, #0e2919 0%, #0b160e 48%, #0b0e0b 100%);
      text-align: center;
      opacity: 1;
    }
    .notfound-screen[hidden] { display: none !important; }
    .notfound-code {
      margin: 0;
      color: #31573d;
      font: 800 clamp(112px, 25vw, 176px)/0.95 Arial, sans-serif;
      letter-spacing: -0.065em;
    }
    .notfound-code span { color: #3cb874; }
    .notfound-text {
      max-width: 580px;
      margin: 0;
      color: #f4f7f4;
      font: 700 clamp(28px, 7vw, 42px)/1.12 Arial, sans-serif;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
</style></head>
<body><main class="notfound-screen" role="status"><div class="notfound-code" aria-hidden="true">404<span>.</span></div><h1 class="notfound-text" id="message">Не удалось загрузить инвойс</h1></main><script>
/* CHECKOUT REDIRECT START */
(() => {
  const match = window.location.pathname.match(/^\/order\/([a-z0-9]{4}(?:-[a-z0-9]{4}){3})\/?$/);
  if (match) window.location.replace('/order/?checkout=' + encodeURIComponent(match[1]));
  else document.getElementById('message').textContent = 'Не удалось загрузить инвойс';
})();
/* CHECKOUT REDIRECT END */
</script></body></html>
