<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Plata Pay</title>
<style>html,body{margin:0;min-height:100%;background:#141414;color:#eee;font-family:system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center}p{padding:24px;text-align:center;color:#aaa}</style></head>
<body><p id="message" role="status">Загружаем счёт…</p><script>
/* CHECKOUT REDIRECT START */
(() => {
  const match = window.location.pathname.match(/^\/order\/([a-z0-9]{4}(?:-[a-z0-9]{4}){3})\/?$/);
  if (match) window.location.replace('/order/?checkout=' + encodeURIComponent(match[1]));
  else document.getElementById('message').textContent = 'Страница не найдена';
})();
/* CHECKOUT REDIRECT END */
</script><noscript>Для загрузки счёта включите JavaScript.</noscript></body></html>
